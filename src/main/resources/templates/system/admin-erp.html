<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<th:block layout:fragment="content">
    <style>
        .erp-status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pending  { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
        .badge-active   { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .badge-inactive { background: #f5f5f5; color: #8c8c8c; border: 1px solid #d9d9d9; }

        .erp-config-panel {
            display: none;
            background: #f8f9ff;
            border: 1px solid #d0d7ff;
            border-radius: 6px;
            padding: 16px 20px;
            margin-top: 8px;
        }
        .erp-config-panel.open { display: block; }

        .erp-config-panel table { width: 100%; border-collapse: collapse; }
        .erp-config-panel th {
            text-align: left;
            padding: 7px 10px;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            width: 120px;
            white-space: nowrap;
            background: #eef0ff;
            border: 1px solid #d0d7ff;
        }
        .erp-config-panel td {
            padding: 6px 8px;
            border: 1px solid #d0d7ff;
        }
        .erp-config-panel input[type="text"],
        .erp-config-panel input[type="password"] {
            width: 220px;
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn-erp-test {
            background: #595959; color: #fff;
            border: none; border-radius: 4px;
            padding: 5px 14px; cursor: pointer;
            font-size: 12px; margin-left: 8px;
        }
        .btn-erp-test:hover { background: #333; }

        .btn-erp-complete {
            background: #52c41a; color: #fff;
            border: none; border-radius: 4px;
            padding: 5px 14px; cursor: pointer;
            font-size: 12px; margin-left: 8px;
        }
        .btn-erp-complete:hover { background: #389e0d; }

        .btn-erp-cancel {
            background: #ff4d4f; color: #fff;
            border: none; border-radius: 4px;
            padding: 5px 14px; cursor: pointer;
            font-size: 12px; margin-left: 8px;
        }
        .btn-erp-cancel:hover { background: #cf1322; }

        .btn-toggle-panel {
            background: #1890ff; color: #fff;
            border: none; border-radius: 4px;
            padding: 4px 12px; cursor: pointer;
            font-size: 12px;
        }
        .btn-toggle-panel:hover { background: #096dd9; }

        .erp-conn-status {
            display: inline-block;
            font-size: 12px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .erp-conn-status.ok   { color: #52c41a; }
        .erp-conn-status.fail { color: #ff4d4f; }

        /* 탭 */
        .erp-tab-wrap {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #1890ff;
            margin-bottom: 16px;
        }
        .erp-tab {
            padding: 8px 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #888;
            border: 1px solid #e8e8e8;
            border-bottom: none;
            background: #fafafa;
            border-radius: 4px 4px 0 0;
            margin-right: 4px;
        }
        .erp-tab.active {
            color: #1890ff;
            background: #fff;
            border-color: #1890ff;
            border-bottom: 2px solid #fff;
            margin-bottom: -2px;
        }
        .erp-tab-content { display: none; }
        .erp-tab-content.active { display: block; }

        /* 목록 행 */
        .erp-list-row {
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .erp-list-header {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 12px;
            background: #fff;
            cursor: pointer;
        }
        .erp-list-header:hover { background: #f5f7ff; }
        .erp-spjangcd {
            font-size: 12px;
            color: #888;
            background: #f5f5f5;
            padding: 2px 8px;
            border-radius: 3px;
            min-width: 36px;
            text-align: center;
        }
        .erp-spjangnm {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            color: #222;
        }
        .erp-prenm {
            font-size: 12px;
            color: #888;
        }

        .empty-msg {
            text-align: center;
            padding: 32px;
            color: #bbb;
            font-size: 14px;
        }
    </style>

    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>ERP 연동 관리</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>관리자</li>
                <li>ERP 연동 관리</li>
            </ul>
        </div>

        <section class="section">
            <div class="container-fluid">

                <div class="section-top">
                    <div class="title-wrap"></div>
                    <div class="button-wrap" style="justify-content: end">
                        <ul>
                            <li>
                                <a class="btn btn-edit" title="새로고침" onclick="loadErpList()">
                                    <img th:src="@{/images/icon/ico-save.svg}" alt="새로고침">
                                    새로고침
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- 탭 -->
                <div class="erp-tab-wrap">
                    <div class="erp-tab active" onclick="switchTab('pending')">
                        ⏳ 신청 대기 <span id="pendingCount" style="background:#fa8c16;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;">0</span>
                    </div>
                    <div class="erp-tab" onclick="switchTab('active')">
                        ✓ 연동 완료 <span id="activeCount" style="background:#52c41a;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;">0</span>
                    </div>
                </div>

                <!-- PENDING 탭 -->
                <div class="erp-tab-content active" id="tab-pending">
                    <div id="pendingList"></div>
                </div>

                <!-- ACTIVE 탭 -->
                <div class="erp-tab-content" id="tab-active">
                    <div id="activeList"></div>
                </div>

            </div>
        </section>
    </div>

    <footer style="margin-top:5px;">
        <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
    </footer>
    <div style="height:10px;"></div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript">

        var erpData = [];

        document.readyState === 'complete' ? loadErpList() : window.onload = loadErpList;

        function loadErpList() {
            $.ajax({
                url: withCtx('/api/workplace/erp/list'), type: 'GET',
                success: function(res) {
                    erpData = res.data || [];
                    renderAll();
                },
                error: function() { Alert.alert('', '목록 조회 중 오류가 발생했습니다.'); }
            });
        }

        function renderAll() {
            var pending = erpData.filter(function(d) { return d.status === 'PENDING'; });
            var active  = erpData.filter(function(d) { return d.status === 'ACTIVE'; });

            document.getElementById('pendingCount').textContent = pending.length;
            document.getElementById('activeCount').textContent  = active.length;

            renderList('pendingList', pending, true);
            renderList('activeList',  active,  false);
        }

        function renderList(containerId, list, isPending) {
            var el = document.getElementById(containerId);
            if (list.length === 0) {
                el.innerHTML = '<div class="empty-msg">' + (isPending ? '신청 대기 중인 사업장이 없습니다.' : '연동 완료된 사업장이 없습니다.') + '</div>';
                return;
            }
            el.innerHTML = list.map(function(item) {
                var panelId  = 'panel-' + item.spjangcd;
                var statusBadge = isPending
                    ? '<span class="erp-status-badge badge-pending">⏳ 대기중</span>'
                    : '<span class="erp-status-badge badge-active">✓ 완료</span>';

                var hostVal      = item.host       || '';
                var portVal      = item.port       || '1433';
                var dbNameVal    = item.db_name    || '';
                var custcdVal    = item.custcd     || '';
                var usernameVal  = item.username   || '';
                var msSpjangVal  = item.ms_spjangcd || '';
                var passwordVal  = item.password   || '';

                return '<div class="erp-list-row" id="row-' + item.spjangcd + '">'
                    + '<div class="erp-list-header" onclick="togglePanel(\'' + item.spjangcd + '\')">'
                    +   '<span class="erp-spjangcd">' + item.spjangcd + '</span>'
                    +   '<span class="erp-spjangnm">' + (item.spjangnm || '') + '</span>'
                    +   (item.prenm ? '<span class="erp-prenm">' + item.prenm + '</span>' : '')
                    +   statusBadge
                    +   '<button type="button" class="btn-toggle-panel">설정</button>'
                    + '</div>'
                    + '<div class="erp-config-panel" id="' + panelId + '">'
                    +   '<table>'
                    +     '<tr>'
                    +       '<th>DB 호스트</th>'
                    +       '<td><input type="text" id="host-' + item.spjangcd + '" value="' + hostVal + '" placeholder="192.168.0.1"></td>'
                    +       '<th>포트</th>'
                    +       '<td><input type="text" id="port-' + item.spjangcd + '" value="' + portVal + '" style="width:80px;"></td>'
                    +     '</tr>'
                    +     '<tr>'
                    +       '<th>DB명</th>'
                    +       '<td><input type="text" id="dbName-' + item.spjangcd + '" value="' + dbNameVal + '" placeholder="데이터베이스명"></td>'
                    +       '<th>업체코드</th>'
                    +       '<td><input type="text" id="custcd-' + item.spjangcd + '" value="' + custcdVal + '" placeholder="자동조회" style="width:100px;"></td>'
                    +     '</tr>'
                    +     '<tr>'
                    +       '<th>계정</th>'
                    +       '<td><input type="text" id="username-' + item.spjangcd + '" value="' + usernameVal + '" placeholder="접속 계정"></td>'
                    +       '<th>비밀번호</th>'
                    +       '<td><input type="text" id="password-' + item.spjangcd + '" value="' + passwordVal + '" placeholder="접속 비밀번호"></td>'
                    +     '</tr>'
                    +     '<tr>'
                    +       '<th>MS 사업장코드</th>'
                    +       '<td colspan="3">'
                    +         '<input type="text" id="msSpjangcd-' + item.spjangcd + '" value="' + msSpjangVal + '" placeholder="ZZ" style="width:80px;">'
                    +         '<button type="button" class="btn-erp-test" onclick="testConnection(\'' + item.spjangcd + '\')">연결 테스트</button>'
                    +         '<span class="erp-conn-status" id="connStatus-' + item.spjangcd + '"></span>'
                    +         '<button type="button" class="btn-erp-complete" onclick="completeErp(\'' + item.spjangcd + '\')">완료 처리</button>'
                    +         (isPending ? '' : '<button type="button" class="btn-erp-cancel" onclick="cancelErp(\'' + item.spjangcd + '\')">연동 해제</button>')
                    +       '</td>'
                    +     '</tr>'
                    +   '</table>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        function togglePanel(spjangcd) {
            var panel = document.getElementById('panel-' + spjangcd);
            panel.classList.toggle('open');
        }

        function switchTab(tab) {
            document.querySelectorAll('.erp-tab').forEach(function(el) { el.classList.remove('active'); });
            document.querySelectorAll('.erp-tab-content').forEach(function(el) { el.classList.remove('active'); });
            event.currentTarget.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function testConnection(spjangcd) {
            var statusEl = document.getElementById('connStatus-' + spjangcd);
            statusEl.textContent = '연결 중...';
            statusEl.className = 'erp-conn-status';

            $.ajax({
                url: withCtx('/api/workplace/erp-test'), type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(getErpFields(spjangcd)),
                headers: {'X-CSRF-Token': $('[name=_csrf]').val()},
                success: function(res) {
                    statusEl.textContent = res.success ? '✓ 연결 성공' : ('✗ ' + (res.message || '연결 실패'));
                    statusEl.className = 'erp-conn-status ' + (res.success ? 'ok' : 'fail');
                },
                error: function() {
                    statusEl.textContent = '✗ 연결 실패';
                    statusEl.className = 'erp-conn-status fail';
                }
            });
        }

        function completeErp(spjangcd) {
            var fields = getErpFields(spjangcd);
            if (!fields.host)       { Alert.alert('', 'DB 호스트를 입력하세요.'); return; }
            if (!fields.port)       { Alert.alert('', '포트를 입력하세요.'); return; }
            if (!fields.dbName)     { Alert.alert('', 'DB명을 입력하세요.'); return; }
            if (!fields.username)   { Alert.alert('', '계정을 입력하세요.'); return; }
            if (!fields.password)   { Alert.alert('', '비밀번호를 입력하세요.'); return; }
            if (!fields.msSpjangcd) { Alert.alert('', 'MS 사업장코드를 입력하세요.'); return; }

            Alert.confirm('', '연동 완료 처리하시겠습니까?<br>DB 정보를 저장하고 이용기관의 ERP 연동을 활성화합니다.', function() {
                $.ajax({
                    url: withCtx('/api/workplace/erp/save'), type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(Object.assign({ spjangcd: spjangcd }, fields)),
                    headers: {'X-CSRF-Token': $('[name=_csrf]').val()},
                    success: function(res) {
                        if (res.success) {
                            Alert.alert('', '연동 완료 처리되었습니다.');
                            loadErpList();
                        } else {
                            Alert.alert('', res.message || '처리에 실패했습니다.');
                        }
                    },
                    error: function() { Alert.alert('', '오류가 발생했습니다.'); }
                });
            });
        }

        function cancelErp(spjangcd) {
            Alert.confirm('', '연동을 해제하시겠습니까?<br>ERP 접속 정보가 초기화됩니다.', function() {
                $.ajax({
                    url: withCtx('/api/workplace/erp/cancel'), type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ spjangcd: spjangcd }),
                    headers: {'X-CSRF-Token': $('[name=_csrf]').val()},
                    success: function(res) {
                        if (res.success) {
                            Alert.alert('', '연동이 해제되었습니다.');
                            loadErpList();
                        } else {
                            Alert.alert('', res.message || '처리에 실패했습니다.');
                        }
                    },
                    error: function() { Alert.alert('', '오류가 발생했습니다.'); }
                });
            });
        }

        function getErpFields(spjangcd) {
            return {
                host:        document.getElementById('host-'       + spjangcd).value.trim(),
                port:        document.getElementById('port-'       + spjangcd).value.trim(),
                dbName:      document.getElementById('dbName-'     + spjangcd).value.trim(),
                custcd:      document.getElementById('custcd-'     + spjangcd).value.trim(),
                username:    document.getElementById('username-'   + spjangcd).value.trim(),
                password:    document.getElementById('password-'   + spjangcd).value.trim(),
                msSpjangcd:  document.getElementById('msSpjangcd-' + spjangcd).value.trim()
            };
        }
    </script>
</th:block>
</html>
