<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .wj-header { text-align: center !important; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 11px; font-weight: 600; }
        .status-PENDING   { background: #fff3cd; color: #856404; }
        .status-REQUESTED { background: #cce5ff; color: #004085; }
        .status-SUCCESS   { background: #d4edda; color: #155724; }
        .status-FAIL      { background: #f8d7da; color: #721c24; }
        .status-CANCEL    { background: #e2e3e5; color: #383d41; }
        .summary-cards {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .summary-card {
            flex: 1;
            background: #fff;
            border: 1px solid #dde0ea;
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .summary-card .card-label {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }
        .summary-card .card-value {
            font-size: 20px;
            font-weight: 700;
            color: #222;
        }
        .summary-card .card-sub {
            font-size: 18px;
            color: #333;
            font-weight: 700;
        }
        .summary-card.success { border-top: 3px solid #28a745; }
        .summary-card.fail    { border-top: 3px solid #dc3545; }
        .summary-card.rate    { border-top: 3px solid #4a6cf7; }
        .grid-summary {
            display: flex;
            gap: 16px;
            padding: 6px 10px;
            background: #f5f6fa;
            border: 1px solid #dde0ea;
            border-top: none;
            font-size: 12px;
            color: #444;
        }
        .grid-summary span { font-weight: 700; color: #4a6cf7; }

        /* EB22 파일 목록 모달 스타일 */
        .modal-eb22 {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1051;
            align-items: center;
            justify-content: center;
        }
        .modal-eb22.show {
            display: flex;
        }
        .modal-eb22-content {
            background: #fff;
            border-radius: 8px;
            padding: 24px 28px;
            width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }
        .modal-eb22-header {
            margin: 0 0 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #dde0ea;
            font-size: 15px;
            font-weight: 600;
            color: #222;
        }
        .modal-eb22-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #999;
            font-size: 14px;
        }
        .modal-eb22-error {
            padding: 16px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            color: #721c24;
            margin-bottom: 12px;
        }
        .modal-eb22-file-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .modal-eb22-file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid #dde0ea;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-eb22-file-item:hover {
            background: #f5f6fa;
        }
        .modal-eb22-file-item.selected {
            background: #cce5ff;
            border-color: #004085;
        }
        .modal-eb22-file-item.processed {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .modal-eb22-file-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .modal-eb22-file-info {
            flex: 1;
        }
        .modal-eb22-file-name {
            font-weight: 600;
            color: #222;
            margin-bottom: 4px;
        }
        .modal-eb22-file-meta {
            font-size: 12px;
            color: #888;
        }
        .modal-eb22-file-status {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        .modal-eb22-file-status.processed {
            background: #e2e3e5;
            color: #383d41;
        }
        .modal-eb22-file-status.pending {
            background: #fff3cd;
            color: #856404;
        }
        .modal-eb22-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding-top: 12px;
            border-top: 1px solid #dde0ea;
        }
        .btn-modal {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-modal-cancel {
            background: #e2e3e5;
            color: #383d41;
        }
        .btn-modal-cancel:hover {
            background: #d4d5d8;
        }
        .btn-modal-process {
            background: #4a6cf7;
            color: #fff;
        }
        .btn-modal-process:hover:not(:disabled) {
            background: #3858d6;
        }
        .btn-modal-process:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>수납 결과 조회</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>수납 관리</li>
                <li>수납 결과 조회</li>
            </ul>
        </div>

        <!-- 요약 카드 -->
        <div class="summary-cards">
            <div class="summary-card success">
                <div class="card-label">성공 건수</div>
                <div style="display:flex; align-items:baseline; gap:10px;">
                    <div class="card-value" id="cardSuccessCount">0건</div>
                    <div class="card-sub" id="cardSuccessAmt">0원</div>
                </div>
            </div>
            <div class="summary-card fail">
                <div class="card-label">실패 건수</div>
                <div style="display:flex; align-items:baseline; gap:10px;">
                    <div class="card-value" id="cardFailCount">0건</div>
                    <div class="card-sub" id="cardFailAmt">0원</div>
                </div>
            </div>
            <div class="summary-card rate">
                <div class="card-label">수납률</div>
                <div style="display:flex; align-items:baseline; gap:10px;">
                    <div class="card-value" id="cardRate">0%</div>
                    <div class="card-sub" id="cardRateSub">성공금액 / 전체금액</div>
                </div>
            </div>
        </div>

        <section class="section">
            <div class="section-top">
                <div class="search-wrap">
                    <dl>
                        <dt><label><span class="eq">*</span>출금일자</label></dt>
                        <dd>
                            <div class="srch-box" style="display:flex; align-items:center; gap:4px;">
                                <input type="date" class="form-control2" id="srchDeductDateFrom" style="width:130px;">
                                <span>~</span>
                                <input type="date" class="form-control2" id="srchDeductDateTo" style="width:130px;">
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt><label>상태</label></dt>
                        <dd>
                            <select id="srchStatus" class="form-control2" style="min-width:90px;">
                                <option value="">전체</option>
                                <option value="SUCCESS">성공</option>
                                <option value="FAIL">실패</option>
                            </select>
                        </dd>
                    </dl>
                    <dl>
                        <dt><label>납부자명</label></dt>
                        <dd><div class="srch-box"><input type="text" class="form-control2" id="srchMemberName"></div></dd>
                    </dl>
                    <dl>
                        <dt><span class="eq"></span></dt>
                        <dd>
                            <li><a class="btn btn-delete" id="btnSearch">
                                <img th:src="@{/images/icon/btn-srch.svg}" alt="검색">검색</a></li>
                        </dd>
                    </dl>
                </div>
                <div style="padding: 6px 0;">
                    <!--                    <button type="button" class="btn-default" id="btnResend"-->
                    <!--                            style="background:#dc3545; color:#fff;">재청구</button>-->
                    <button type="button" class="btn-default" id="btnReceiveNow"
                            style="background:#4a6cf7; color:#fff;">결과 수신</button>
                    <button type="button" class="btn-default" id="btnErpResync"
                            style="background:#e67e22; color:#fff;">ERP 반영</button>
                    <button type="button" class="btn-default" id="btnExcel"
                            style="background:#217346; color:#fff;width: 120px;">엑셀 다운로드</button>
                </div>
            </div>
            <div class="container-fluid">
                <div id="theGrid"></div>
                <div id="listBar" style="display:flex; align-items:center; gap:6px; margin:6px 0;">
                    <span id="paginationBar" style="display:flex; align-items:center; gap:6px;">
                        <button onclick="searchList(0)"             style="padding:2px 8px;">◀◀</button>
                        <button onclick="searchList(currentPage-1)" style="padding:2px 8px;" id="btnPrevPage">◀</button>
                        <span id="pageInfo" style="font-size:13px;"></span>
                        <button onclick="searchList(currentPage+1)" style="padding:2px 8px;" id="btnNextPage">▶</button>
                        <button onclick="searchList(totalPages-1)"  style="padding:2px 8px;" id="btnLastPage">▶▶</button>
                    </span>
                    <span id="infiniteBar" style="display:none; align-items:center; gap:8px; font-size:13px;">
                        <span id="infInfo" style="color:#555;"></span>
                        <button type="button" id="btnInfMore" style="padding:2px 10px;">더 보기</button>
                        <span id="infLoadingMsg" style="display:none; color:#4a6cf7;">불러오는 중…</span>
                    </span>
                    <!-- 보기 방식 전환: 아이콘만. 설명은 툴팁(title)으로 -->
                    <button type="button" id="btnToggleViewMode" title="스크롤해서 이어보기"
                            style="margin-left:4px; padding:1px 8px; font-size:14px; line-height:20px;
                                   border:1px solid #dde0ea; border-radius:4px;
                                   background:#f5f6fa; cursor:pointer;">☰</button>
                </div>
                <div class="grid-summary">
                    <div>전체: <span id="summaryTotal">0</span>건 &nbsp; 페이지 합계: <span id="summaryPageAmt">0</span>원</div>
                    <div>페이지 성공: <span id="summarySuccessCount">0</span>건 &nbsp; <span id="summarySuccessAmt">0</span>원</div>
                    <div>페이지 실패: <span id="summaryFailCount">0</span>건 &nbsp; <span id="summaryFailAmt">0</span>원</div>
                </div>
            </div>
        </section>
    </div>

    <!-- EB22 파일 목록 모달 -->
    <div id="modalEb22Files" class="modal-eb22">
        <div class="modal-eb22-content">
            <div class="modal-eb22-header">
                수신 가능한 EB22 결과 파일 목록
                <span style="font-size:12px; color:#888; font-weight:normal; display:block; margin-top:4px;">
                    필요한 파일을 수동으로 선택하여 처리하세요.
                </span>
            </div>

            <div id="modalEb22Error" class="modal-eb22-error" style="display:none;"></div>

            <div id="modalEb22FileList" class="modal-eb22-file-list">
                <div class="modal-eb22-loading">
                    <span>파일 목록을 불러오는 중...</span>
                </div>
            </div>

            <div class="modal-eb22-footer">
                <button type="button" class="btn-modal btn-modal-cancel" id="btnEb22Cancel">취소</button>
                <button type="button" class="btn-modal btn-modal-process" id="btnEb22Process" disabled>
                    선택 파일 처리
                </button>
            </div>
        </div>
    </div>

    <footer style="margin-top: 24px;">
        <p>Copyright&#169; 0000 corp. All rights reserved.</p>
    </footer>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript">
        var theGrid;
        var lastResultRows = [];
        var viewdata;
        let eb22SelectedFile = null;
        let eb22Files = [];

        var STATUS_MAP = {
            PENDING:   '대기',
            REQUESTED: '출금요청',
            SUCCESS:   '성공',
            FAIL:      '실패',
            CANCEL:    '취소'
        };

        var columns = [
            {binding: 'billing_seq',  header: '청구번호',  width: 130, align: 'center'},
            {binding: 'member_name',  header: '납부자명',  width: 140, align: 'left'},
            {binding: 'id_number',    header: '식별번호',   width: 110, align: 'center'},
            {binding: 'bank_name',    header: '은행',      width: 80,  align: 'center'},
            {binding: 'bank_account', header: '계좌번호',  width: 150, align: 'center'},
            {binding: 'billing_amount', header: '청구금액', width: 110, align: 'right',
                cellTemplate: function(ctx) {
                    return ctx.value != null ? Number(ctx.value).toLocaleString() : '';
                }},
            {binding: 'fee_total', header: '수수료', width: 90, align: 'right',
                cellTemplate: function(ctx) {
                    return ctx.value != null ? Number(ctx.value).toLocaleString() : '';
                }},
            {binding: 'billing_amount', header: '입금금액', width: 110, align: 'right',
                cellTemplate: function(ctx) {
                    var item = ctx.row.dataItem;
                    if (item.status !== 'SUCCESS') return '-';
                    var billing = Number(item.billing_amount) || 0;
                    var fee = Number(item.fee_total) || 0;
                    return (billing - fee).toLocaleString();
                }},
            {binding: 'deduct_date',  header: '출금일자',  width: 100, align: 'center',
                cellTemplate: function(ctx) {
                    if (!ctx.value) return '-';
                    var v = String(ctx.value);
                    return v.length === 8
                        ? v.substring(0,4) + '-' + v.substring(4,6) + '-' + v.substring(6,8)
                        : v;
                }},
            {binding: 'status', header: '상태', width: 80, align: 'center',
                cellTemplate: function(ctx) {
                    var label = STATUS_MAP[ctx.value] || ctx.value || '';
                    return '<span class="status-badge status-' + ctx.value + '">' + label + '</span>';
                }},
            {binding: 'result_code',  header: '결과코드',  width: 90,  align: 'center'},
            {binding: 'result_msg',   header: '결과메시지', width: 200, align: 'left'},
            {binding: 'result_date',    header: '처리일자',  width: 100, align: 'center',  // ← yyyy-mm-dd 포맷
                cellTemplate: function(ctx) {
                    if (!ctx.value) return '-';
                    var v = String(ctx.value);
                    return v.length === 8
                        ? v.substring(0,4) + '-' + v.substring(4,6) + '-' + v.substring(6,8)
                        : v;
                }},
            {binding: 'recharged_yn', header: '재청구', width: 80, align: 'center',
                cellTemplate: function(ctx) {
                    var item = ctx.row.dataItem;
                    if (ctx.value === 'Y' && item.status === 'FAIL') {
                        return '<span style="background:#e8f4fd; color:#4a90d9; padding:2px 7px; border-radius:8px; font-size:11px; font-weight:600;">재청구</span>';
                    }
                    return '';
                }},
        ];

        // 엑셀 전용 컬럼 — 사업자번호·주민번호는 화면에 상시 노출하지 않고
        // 다운로드 파일에만 포함한다(개인정보 노출 최소화).
        var EXPORT_EXTRA_COLUMNS = [
            { binding: 'biz_no',      header: '사업자번호', width: 130, align: 'center' },
            { binding: 'resident_no', header: '주민번호',   width: 140, align: 'center' }
        ];
        function buildExportColumns() {
            return columns.filter(function (c) { return c.binding !== 'selected'; })
                .concat(EXPORT_EXTRA_COLUMNS);
        }


        document.readyState === 'complete' ? init() : window.onload = init;

        var currentPage = 0, totalPages = 1;

        // ── 목록 표시 모드: 'page'(페이징) / 'infinite'(무한스크롤) ──────────
        var PAGE_SIZE = 10;      // 페이징 1페이지 건수
        var INF_SIZE  = 50;      // 무한스크롤 1회 로드 건수
        var viewMode  = 'page';
        var infRows   = [];      // 무한스크롤 누적 행 (lastResultRows와 같은 배열을 공유)
        var infPage   = 0;       // 다음에 불러올 페이지
        var infLoading = false;  // 중복 요청 방지
        var infEnd    = false;   // 더 없음
        var infScrollBound = false;

        function init() {
            var now = new Date();
            var y = now.getFullYear(), m = now.getMonth();
            var pad = function (n) { return String(n).padStart(2, '0'); };
            var first = y + '-' + pad(m + 1) + '-01';
            var last  = y + '-' + pad(m + 1) + '-' + pad(new Date(y, m + 1, 0).getDate());
            $('#srchDeductDateFrom').val(first);
            $('#srchDeductDateTo').val(last);
            searchList(0);
        }

        // 검색 파라미터 단일 진입점. 목록/엑셀이 같은 조건을 쓰도록 한 곳에서 만든다.
        // (기존에는 엑셀이 따로 만들어 deduct_type 등이 빠져 화면과 다른 결과가 받아졌다)
        function buildSearchParams(page, size) {
            return {
                deduct_date_from: ($('#srchDeductDateFrom').val() || '').replace(/-/g, ''),
                deduct_date_to:   ($('#srchDeductDateTo').val()   || '').replace(/-/g, ''),
                deduct_type:  $('#srchDeductType').val(),
                status:       $('#srchStatus').val(),
                member_name:  $('#srchMemberName').val(),
                page: page,
                size: size
            };
        }

        // 목록 조회 진입점. 외부에서는 searchList(0)로만 부르면 모드에 맞게 동작한다.
        function searchList(page) {
            if (viewMode === 'infinite') { loadInfinite(true); return; }
            if (page < 0 || page >= totalPages) return;
            currentPage = page;
            $.ajax({
                url: withCtx('/api/cms/billing/result/list'),
                type: 'GET',
                data: buildSearchParams(currentPage, PAGE_SIZE),
                success: function (result) {
                    if (result.success) {
                        var d = result.data;
                        bindGrid(d.data || []);
                        updateSummary(d);
                        updatePagination(d.totalCount);
                    }
                }
            });
        }

        function updatePagination(totalCount) {
            totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
            $('#pageInfo').text((currentPage + 1) + ' / ' + totalPages + ' 페이지');
            $('#btnPrevPage').prop('disabled', currentPage === 0);
            $('#btnNextPage, #btnLastPage').prop('disabled', currentPage >= totalPages - 1);
        }

        // 무한스크롤 로드. reset=true면 처음부터 다시.
        function loadInfinite(reset) {
            if (infLoading) return;
            if (reset) { infRows = []; infPage = 0; infEnd = false; }
            if (infEnd) return;

            infLoading = true;
            $('#infLoadingMsg').show();
            $('#btnInfMore').prop('disabled', true);

            $.ajax({
                url: withCtx('/api/cms/billing/result/list'),
                type: 'GET',
                data: buildSearchParams(infPage, INF_SIZE),
                success: function (result) {
                    if (result && result.success) {
                        var d    = result.data || {};
                        var rows = d.data || [];

                        if (reset || !theGrid) {
                            infRows = rows.slice();
                            bindGrid(infRows);          // lastResultRows도 이 배열을 참조하게 된다
                            bindInfiniteScroll();
                        } else {
                            // 그리드를 다시 만들지 않고 누적 — 스크롤 위치가 유지된다.
                            rows.forEach(function (r) { infRows.push(r); });
                            viewdata.refresh();
                        }

                        infPage++;
                        if (rows.length < INF_SIZE || infRows.length >= (d.totalCount || 0)) infEnd = true;

                        // 하단 요약은 누적분 기준, 상단 카드는 서버 전체 집계 기준
                        var dd = {}; for (var k in d) dd[k] = d[k];
                        dd.data = infRows;
                        updateSummary(dd);
                        updateInfiniteInfo(d.totalCount || 0);
                    }
                },
                complete: function () {
                    infLoading = false;
                    $('#infLoadingMsg').hide();
                    $('#btnInfMore').prop('disabled', infEnd);
                }
            });
        }

        // 그리드 하단 도달 시 자동 로드
        function bindInfiniteScroll() {
            if (!theGrid || infScrollBound) return;
            theGrid.scrollPositionChanged.addHandler(function (s) {
                if (viewMode !== 'infinite' || infLoading || infEnd) return;
                if (s.viewRange.bottomRow >= s.rows.length - 1) loadInfinite(false);
            });
            infScrollBound = true;
        }

        function updateInfiniteInfo(totalCount) {
            $('#infInfo').text(infRows.length.toLocaleString() + ' / ' + (totalCount || 0).toLocaleString() + '건'
                + (infEnd ? ' (전체 표시)' : ''));
        }

        // 모드 전환 — 그리드는 새로 만들고 첫 화면부터 다시 조회
        function setViewMode(mode) {
            viewMode = mode;
            infScrollBound = false;
            if (theGrid) { theGrid.dispose(); theGrid = null; }

            if (mode === 'infinite') {
                $('#paginationBar').hide();
                $('#infiniteBar').css('display', 'flex');
                $('#btnToggleViewMode').text('❐').attr('title', '페이지 나눠보기');
                $('#theGrid').css({ height: '560px', overflow: 'hidden' });
                loadInfinite(true);
            } else {
                $('#infiniteBar').hide();
                $('#paginationBar').css('display', 'flex');
                $('#btnToggleViewMode').text('☰').attr('title', '스크롤해서 이어보기');
                $('#theGrid').css({ height: '', overflow: '' });
                totalPages = 1;
                searchList(0);
            }
        }

        function bindGrid(data) {
            lastResultRows = data || [];
            if (theGrid) theGrid.dispose();
            viewdata = new wijmo.collections.CollectionView(data);
            theGrid = new wijmo.grid.FlexGrid('#theGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                columns: columns,
                isReadOnly: true,
                itemsSource: viewdata
            });
            theGrid.rowHeaders.columns.splice(0, 1);

            new FlexGridContextMenu(this.theGrid);
            // 우클릭 컨텍스트 메뉴의 엑셀 저장은 itemsSource(=화면 로드분)만 저장하므로 쓰지 않는다.
            // 전체 다운로드는 상단 [엑셀 다운로드] 버튼(exportExcel)을 사용한다.
        }

        function openRechargeModal() {
            var startStr = ($('#srchDeductDateFrom').val() || '').replace(/-/g, '');
            var endStr   = ($('#srchDeductDateTo').val()   || '').replace(/-/g, '');
            if (!startStr || !endStr) {
                Alert.alert('', '출금일자 범위를 선택하세요.');
                return;
            }

            $.ajax({
                url: withCtx('/api/cms/billing/history/list'),
                type: 'GET',
                data: {
                    start_date: startStr,
                    end_date: endStr,
                    status: 'FAIL,ERROR',
                    billing_type: 'EB',
                    recharge_filter: true
                },
                success: function (result) {
                    if (!result.success || !result.data || result.data.length === 0) {
                        Alert.alert('', '재청구할 실패 건이 없습니다.');
                        return;
                    }
                    renderRechargeModal(result.data);
                    $('#modalRecharge').css('display', 'flex');
                }
            });
        }

        function renderRechargeModal(rows) {
            // 다음 영업일 계산 후 디폴트 출금일 세팅
            var tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            var tomorrowStr = tomorrow.getFullYear() + '-'
                + String(tomorrow.getMonth() + 1).padStart(2, '0') + '-'
                + String(tomorrow.getDate()).padStart(2, '0');
            $('#rechargeAllDate').val(tomorrowStr);

            var html = '';
            rows.forEach(function (row) {
                var deductFmt = '';
                var v = String(row.deduct_date || '');
                if (v.length === 8) deductFmt = v.substring(0, 4) + '-' + v.substring(4, 6) + '-' + v.substring(6, 8);
                html += '<tr>'
                    + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">'
                    + '<input type="checkbox" class="recharge-check" checked data-id="' + row.id + '">'
                    + '</td>'
                    + '<td style="padding:7px 8px; border:1px solid #dde0ea;">' + (row.member_name || '') + '</td>'
                    + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:right;">' + Number(row.billing_amount || 0).toLocaleString() + '원</td>'
                    + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">' + (row.result_msg || '-') + '</td>'
                    + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">' + deductFmt + '</td>'
                    + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">'
                    + '<input type="date" class="recharge-date" style="border:1px solid #dde0ea; border-radius:3px; font-size:12px;" value="' + tomorrowStr + '">'
                    + '</td>'
                    + '</tr>';
            });
            $('#rechargeRows').html(html);

            // 전체선택 체크박스
            $('#rechargeChkAll').off('change').on('change', function () {
                $('.recharge-check').prop('checked', $(this).is(':checked'));
            });
        }

        function doRecharge() {
            var items = [];
            $('#rechargeRows tr').each(function () {
                var chk = $(this).find('.recharge-check');
                var date = $(this).find('.recharge-date').val();
                if (chk.is(':checked') && date) {
                    items.push({id: chk.data('id'), deduct_date: date.replace(/-/g, '')});
                }
            });
            if (items.length === 0) {
                Alert.alert('', '재청구할 건을 선택하세요.');
                return;
            }

            Alert.confirm('', items.length + '건을 재청구하시겠습니까?', function () {
                $('#modalRecharge').hide();
                // 건별로 순차 처리
                var ids = items.map(function (i) {
                    return i.id;
                }).join(',');
                AjaxUtil.postAsyncData('/api/cms/billing/recharge',
                    {ids: ids},
                    function (result) {
                        if (result.success) {
                            Alert.alert('', (result.data ? result.data.count : 0) + '건 재청구 생성되었습니다.');
                            searchList(0);
                        } else {
                            Alert.alert('재청구 실패', result.message);
                        }
                    });
            });
        }

        function updateSummary(d) {
            var data = d.data || [];

            // ── 상단 요약 카드: 검색조건 전체 기준 (서버 집계값, 페이지 넘겨도 안 바뀜) ──
            var totalSuccessCount = Number(d.successCount) || 0;
            var totalFailCount = Number(d.failCount) || 0;
            var totalSuccessAmt = Number(d.successAmount) || 0;          // 성공 입금금액(수수료 차감)
            var totalFailAmt = Number(d.failAmount) || 0;            // 실패 청구금액
            var totalSuccessBilling = Number(d.successBillingAmount) || 0;   // 수납률 분자(성공 청구금액)
            var totalBillingAmt = Number(d.totalAmount) || 0;           // 전체 청구금액
            var rate = totalBillingAmt > 0 ? (totalSuccessBilling / totalBillingAmt * 100).toFixed(1) : '0.0';

            $('#cardSuccessCount').text(totalSuccessCount.toLocaleString() + '건');
            $('#cardSuccessAmt').text(totalSuccessAmt.toLocaleString() + '원');
            $('#cardFailCount').text(totalFailCount.toLocaleString() + '건');
            $('#cardFailAmt').text(totalFailAmt.toLocaleString() + '원');
            $('#cardRate').text(rate + '%');
            $('#cardRateSub').text(totalSuccessBilling.toLocaleString() + '원 / ' + totalBillingAmt.toLocaleString() + '원');

            // ── 하단 grid-summary: 전체 합계 + 현재 페이지 기준 성공/실패 ──
            var pageSuccessItems = data.filter(function (i) { return i.status === 'SUCCESS'; });
            var pageFailItems    = data.filter(function (i) { return i.status === 'FAIL'; });
            var pageSuccessAmt = pageSuccessItems.reduce(function (s, i) {
                return s + (Number(i.billing_amount) || 0);
            }, 0);
            var pageFailAmt = pageFailItems.reduce(function (s, i) {
                return s + (Number(i.billing_amount) || 0);
            }, 0);
            var pageTotalAmt = data.reduce(function (s, i) {
                return s + (Number(i.billing_amount) || 0);
            }, 0);

            $('#summaryTotal').text((d.totalCount || 0).toLocaleString());
            $('#summaryPageAmt').text(pageTotalAmt.toLocaleString());
            $('#summarySuccessCount').text(pageSuccessItems.length.toLocaleString());
            $('#summarySuccessAmt').text(pageSuccessAmt.toLocaleString());
            $('#summaryFailCount').text(pageFailItems.length.toLocaleString());
            $('#summaryFailAmt').text(pageFailAmt.toLocaleString());
        }

        function openEb22FilesModal() {
            // 모달 열기
            $('#modalEb22Files').addClass('show');
            $('#modalEb22Error').hide();
            $('#modalEb22FileList').html('<div class="modal-eb22-loading"><span>파일 목록을 불러오는 중...</span></div>');
            $('#btnEb22Process').prop('disabled', true);
            eb22SelectedFile = null;

            // SFTP에서 사용 가능한 파일 목록 조회
            loadEb22Files();
        }

        function loadEb22Files() {

            $.ajax({
                url: withCtx('/api/cms/billing/available-files'),
                type: 'GET',
                data: {deduct_type: $('#srchDeductType').val() || 'EB'},
                success: function (response) {
                    if (response.success && response.data) {
                        eb22Files = response.data;
                        renderEb22FileList(eb22Files);
                    } else {
                        showEb22Error('파일 목록 조회 실패: ' + (response.message || '알 수 없는 오류'));
                    }
                },
                error: function (xhr) {
                    var msg = '파일 목록 조회 실패';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        msg = xhr.responseJSON.message;
                    }
                    showEb22Error(msg);
                }
            });
        }

        function renderEb22FileList(files) {
            if (files.length === 0) {
                $('#modalEb22FileList').html(
                    '<div style="padding:20px; text-align:center; color:#888;">' +
                    '수신 가능한 파일이 없습니다.' +
                    '</div>'
                );
                return;
            }

            var html = '';
            files.forEach(function (file, idx) {
                var fileDate = file.yyyy + '-' + file.mmdd.substring(0, 2) + '-' + file.mmdd.substring(2, 4);
                var statusHtml = file.processed ?
                    '<div class="modal-eb22-file-status processed">처리완료</div>' :
                    '<div class="modal-eb22-file-status pending">대기</div>';

                html += '<div class="modal-eb22-file-item' + (file.processed ? ' processed' : '') + '" data-filename="' + file.fileName + '">' +
                    '<input type="radio" name="eb22File" class="modal-eb22-file-checkbox" value="' + file.fileName + '"'
                    + (file.processed ? ' disabled' : '') + '>' +
                    '<div class="modal-eb22-file-info">' +
                    '  <div class="modal-eb22-file-name">' + file.fileName + '</div>' +
                    '  <div class="modal-eb22-file-meta">' +
                    '    날짜: ' + fileDate +
                    '  </div>' +
                    '</div>' +
                    statusHtml +
                    '</div>';
            });

            $('#modalEb22FileList').html(html);

            // 라디오 버튼 이벤트
            $(document).off('change', 'input[name="eb22File"]').on('change', 'input[name="eb22File"]', function () {
                eb22SelectedFile = $(this).val();
                $('#btnEb22Process').prop('disabled', false);
                $('.modal-eb22-file-item').removeClass('selected');
                $(this).closest('.modal-eb22-file-item').addClass('selected');
            });

            // 클릭으로도 선택 가능
            $(document).off('click', '.modal-eb22-file-item').on('click', '.modal-eb22-file-item', function (e) {
                if ($(e.target).is('input[type="radio"]')) return;
                if ($(this).hasClass('processed')) return;  // ← 추가
                $(this).find('input[type="radio"]').click();
            });
        }

        function showEb22Error(msg) {
            $('#modalEb22Error').html(msg).show();
            $('#modalEb22FileList').html('');
        }

        function processSelectedEb22File() {
            if (!eb22SelectedFile) {
                Alert.alert('', '파일을 선택하세요.');
                return;
            }

            Alert.confirm('', eb22SelectedFile + ' 파일을 처리하시겠습니까?', function () {
                AjaxUtil.postAsyncData(
                    '/api/cms/billing/receive-file',
                    {
                        fileName: eb22SelectedFile,
                        deduct_type: $('#srchDeductType').val() || 'EB'
                    },
                    function (response) {
                        if (response.success) {
                            Alert.alert('', response.data.message || '처리가 완료되었습니다.');
                            $('#modalEb22Files').removeClass('show');
                            searchList(0);
                        } else {
                            Alert.alert('처리 실패', response.message);
                        }
                    }
                );
            });
        }

        // 엑셀은 화면 로드분이 아니라 '검색조건 전체'를 다시 조회해서 만든다.
        var EXPORT_SIZE = 1000000;

        function exportExcel() {
            var ddFrom = ($('#srchDeductDateFrom').val() || '').replace(/-/g, '');
            var ddTo   = ($('#srchDeductDateTo').val()   || '').replace(/-/g, '');
            var params = buildSearchParams(0, EXPORT_SIZE);
            $.ajax({
                url: withCtx('/api/cms/billing/result/list'),
                type: 'GET',
                data: params,
                success: function (result) {
                    if (!result || result.success === false) { Alert.alert('', '엑셀 조회 실패: ' + ((result && result.message) || '')); return; }
                    var rows = (result.data && result.data.data) ? result.data.data : (result.data || []);
                    if (!rows.length) { Alert.alert('', '다운로드할 데이터가 없습니다.'); return; }
                    var host = document.createElement('div');
                    host.style.position = 'absolute'; host.style.left = '-99999px'; host.style.top = '0';
                    host.style.width = '1200px'; host.style.height = '400px';
                    document.body.appendChild(host);
                    var tmp = new wijmo.grid.FlexGrid(host, {
                        autoGenerateColumns: false, columns: buildExportColumns(), isReadOnly: true,
                        itemsSource: new wijmo.collections.CollectionView(rows)
                    });
                    var cleanup = function () { try { tmp.dispose(); } catch (e) {} if (host.parentNode) host.parentNode.removeChild(host); };
                    wijmo.grid.xlsx.FlexGridXlsxConverter.saveAsync(
                        tmp, {includeColumnHeaders: true, includeCellStyles: false}, '수납결과_' + ((ddFrom || ddTo) ? (ddFrom + '-' + ddTo) : '전체') + '.xlsx',
                        function () { cleanup(); },
                        function () { cleanup(); Alert.alert('', '엑셀 생성 실패'); }
                    );
                },
                error: function () { Alert.alert('오류', '엑셀 다운로드 조회 실패'); }
            });
        }

        $(document).ready(function () {
            $('#btnSearch').click(function () {
                searchList(0);
            });
            $('#srchMemberName').keypress(function (e) {
                if (e.which === 13) searchList(0);
            });
            $('#btnResend').click(openRechargeModal);
            $('#btnRechargeConfirm').click(doRecharge);
            // $('#btnReceiveNow').click(function() {
            //     Alert.confirm('', '결과 파일을 지금 수신하시겠습니까?', function() {
            //         AjaxUtil.postAsyncData('/api/cms/billing/receive-now',
            //             { deduct_type: $('#srchDeductType').val() || 'EB' },
            //             function(result) {
            //                 if (result.success) {
            //                     Alert.alert('', '수신 완료');
            //                     searchList(0);
            //                 } else {
            //                     Alert.alert('수신 실패', result.message);
            //                 }
            //             });
            //     });
            // });
            // 결과 수신 버튼 클릭
            $('#btnReceiveNow').click(openEb22FilesModal);

            // 모달 닫기
            $('#btnEb22Cancel').click(function () {
                $('#modalEb22Files').removeClass('show');
            });
            // 모달 외부 클릭으로 닫기
            $('#modalEb22Files').click(function (e) {
                if ($(e.target).is('#modalEb22Files')) {
                    $('#modalEb22Files').removeClass('show');
                }
            });

            // 파일 처리 버튼
            $('#btnEb22Process').click(processSelectedEb22File);
            $('#btnExcel').click(exportExcel);
            $('#btnErpResync').click(doErpResync);
            $('#btnInfMore').click(function () { loadInfinite(false); });
            $('#btnToggleViewMode').click(function () {
                setViewMode(viewMode === 'page' ? 'infinite' : 'page');
            });
        });

        // 조회된 결과의 출금일들을 tb_bank_cmssave에 반영(없으면 INSERT)
        function doErpResync() {
            if (!lastResultRows || lastResultRows.length === 0) {
                Alert.alert('', '먼저 결과를 조회하세요.');
                return;
            }
            var set = {};
            lastResultRows.forEach(function (r) {
                var dd = String(r.deduct_date || '').replace(/-/g, '');
                if (dd) set[dd] = true;
            });
            var dates = Object.keys(set);
            if (dates.length === 0) {
                Alert.alert('', '반영할 출금일이 없습니다.');
                return;
            }
            Alert.confirm('', '조회된 출금일 ' + dates.length + '건의 성공 결과를 ERP(tb_bank_cmssave)에 반영합니다.\n(이미 있는 건은 건너뜁니다)', function () {
                $.ajax({
                    url: withCtx('/api/cms/billing/erp-resync'),
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({deduct_dates: dates}),
                    headers: {'X-CSRF-TOKEN': $('[name=_csrf]').val()},
                    success: function (result) {
                        if (result.success) {
                            var d = result.data || {};
                            Alert.alert('ERP 반영 완료',
                                '신규 반영 ' + (d.inserted || 0) + '건, 이미있음 ' + (d.skipped || 0) + '건'
                                + (d.failed > 0 ? ', 실패 ' + d.failed + '건' : ''));
                        } else {
                            Alert.alert('ERP 반영 실패', result.message);
                        }
                    },
                    error: function () {
                        Alert.alert('오류', 'ERP 반영 요청 중 오류가 발생했습니다.');
                    }
                });
            });
        }
    </script>
