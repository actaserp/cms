<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .wj-header {
            text-align: center !important;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-PENDING {
            background: #fff3cd;
            color: #856404;
        }

        .status-SENT {
            background: #cce5ff;
            color: #004085;
        }

        .status-FAILED {
            background: #f8d7da;
            color: #721c24;
        }

        .status-APPROVED {
            background: #d4edda;
            color: #155724;
        }

        .status-REJECTED {
            background: #f0d0ff;
            color: #6a0dad;
        }

        .status-CANCELLED {
            background: #e2e3e5;
            color: #41464b;
        }

        .flow-step {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .flow-pending {
            background: #f5f6fa;
            color: #aaa;
            border: 1px solid #dde0ea;
        }

        .flow-sent {
            background: #cce5ff;
            color: #004085;
        }

        .flow-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .flow-approved {
            background: #d4edda;
            color: #155724;
        }

        .flow-rejected {
            background: #f0d0ff;
            color: #6a0dad;
        }

        .grid-summary {
            display: flex;
            gap: 16px;
            padding: 6px 10px;
            background: #f5f6fa;
            border: 1px solid #dde0ea;
            border-top: none;
            font-size: 12px;
            color: #444;
        }

        .grid-summary span {
            font-weight: 700;
            color: #4a6cf7;
        }
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>출금이체 인증 관리</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>수납 관리</li>
                <li>출금이체 인증 관리</li>
            </ul>
        </div>

        <!-- 흐름 안내 -->
        <div style="display:flex; align-items:center; gap:8px; padding:10px 14px;
                    background:#f0f2ff; border:1px solid #d0d6ff; border-radius:6px;
                    margin-bottom:12px; font-size:12px; color:#333;">
            <span style="font-weight:700; color:#4a6cf7;">처리 흐름</span>
            <span class="flow-step flow-pending">① 등록대기</span>
            <span style="color:#aaa;">→</span>
            <span class="flow-step flow-sent">② 출금동의증빙자료(EI13) 송신</span>
            <span style="color:#aaa;">→ 24시간 이내 →</span>
            <span class="flow-step flow-sent">③ 출금이체신청(EB13) 송신</span>
            <span style="color:#aaa;">→ D+2 →</span>
            <span class="flow-step flow-approved">④ 출금이체신청결과(EB14) 수신</span>
            <span style="color:#aaa;">→</span>
            <span class="flow-step flow-approved">⑤ 동의완료</span>
        </div>

        <section class="section">
            <div class="section-top">
                <div class="search-wrap">
                    <dl>
                        <dt><label>납부자명</label></dt>
                        <dd>
                            <div class="srch-box">
                                <input type="text" class="form-control2" id="srchMemberName">
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt><label>상태</label></dt>
                        <dd>
                            <select id="srchStatus" class="form-control2" style="min-width:90px;">
                                <option value="">전체</option>
                                <option value="PENDING">대기</option>
                                <option value="APPROVED">승인</option>
                                <option value="REJECTED">거절</option>
                                <option value="FAILED">실패</option>
                                <option value="CANCELLED">해지완료</option>
                            </select>
                        </dd>
                    </dl>
                    <dl>
                        <dt><span class="eq"></span></dt>
                        <dd>
                            <li><a class="btn btn-delete" id="btnSearch">
                                <img th:src="@{/images/icon/btn-srch.svg}" alt="검색">검색</a></li>
                        </dd>
                    </dl>
                </div>
                <div style="display:flex; gap:4px; padding: 6px 0;">
                    <button type="button" class="btn-default" id="btnCreateFromErp"
                            style="background:#28a745; color:#fff; width: 120px;">미인증 불러오기</button>
                    <button type="button" class="btn-default" id="btnRegister"
                            style="background:#4a6cf7; color:#fff; width: 120px;" disabled>인증 등록 신청
                    </button>
                    <button type="button" class="btn-default" id="btnReRegister"
                            style="background:#6c757d; color:#fff;" disabled>재신청
                    </button>
                    <button type="button" class="btn-default" id="btnReceiveEb14"
                            style="background:#17a2b8; color:#fff;">결과수신</button>
                </div>
            </div>

            <div class="container-fluid">
                <div id="theGrid"></div>
                <div id="paginationBar" style="display:flex; align-items:center; gap:6px; margin:6px 0;">
                    <button id="btnFirstPage" onclick="searchList(0)" style="padding:2px 8px;">◀◀</button>
                    <button id="btnPrevPage"  onclick="searchList(currentPage-1)" style="padding:2px 8px;">◀</button>
                    <span id="pageInfo" style="font-size:13px;"></span>
                    <button id="btnNextPage"  onclick="searchList(currentPage+1)" style="padding:2px 8px;">▶</button>
                    <button id="btnLastPage"  onclick="searchList(totalPages-1)"  style="padding:2px 8px;">▶▶</button>
                </div>
                <div class="grid-summary">
                    <div>전체: <span id="summaryTotal">0</span>건</div>
                    <div>승인: <span id="summaryApproved">0</span>건</div>
                    <div>대기: <span id="summaryPending">0</span>건</div>
                    <div>거절: <span id="summaryRejected">0</span>건</div>
                    <div>실패: <span id="summaryFailed">0</span>건</div>
                </div>
            </div>
        </section>
    </div>
    <!-- 동의서 파일 모달 템플릿 -->
    <script type="text/x-tmpl" id="agreeFileTmpl">
        <div style="padding: 10px;">
            <table class="write-table" style="width:100%; border-collapse:collapse; margin-bottom:10px;">
                <colgroup><col style="width:30%"><col style="width:70%"></colgroup>
                <tbody>
                <tr>
                    <th style="padding:5px; border:1px solid #ddd; text-align:center;">납부자명</th>
                    <td style="padding:5px; border:1px solid #ddd;">{%=o.member_name%}</td>
                </tr>
                <tr>
                    <th style="padding:5px; border:1px solid #ddd; text-align:center;">계좌번호</th>
                    <td style="padding:5px; border:1px solid #ddd;">{%=o.bank_account%}</td>
                </tr>
                <tr>
                    <th style="padding:5px; border:1px solid #ddd; text-align:center;">상태</th>
                    <td style="padding:5px; border:1px solid #ddd;">{%=o.status_label%}</td>
                </tr>
                </tbody>
            </table>
            <div style="font-size:13px; font-weight:700; color:#4a6cf7;
                 padding:6px 0 4px; border-bottom:1px solid #e0e4ef; margin-bottom:6px;">동의서 파일</div>
            <div id="modalAgreeUploaderDiv"></div>
        </div>
    </script>

    <!-- EB14 수신 모달 -->
    <div id="modalEb14" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
     background:rgba(0,0,0,0.4); z-index:1050; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:8px; padding:24px 28px; min-width:500px;
                box-shadow:0 4px 24px rgba(0,0,0,0.2);">
            <h3 style="margin:0 0 16px; font-size:15px;">EB14 결과수신</h3>
            <table style="width:100%; border-collapse:collapse; font-size:13px; margin-bottom:16px;">
                <thead>
                <tr style="background:#f5f6fa; color:#555;">
                    <th style="padding:7px 8px; border:1px solid #dde0ea; text-align:center; width:36px;"></th>
                    <th style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">파일명</th>
                    <th style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">신청일</th>
                    <th style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">처리여부</th>
                </tr>
                </thead>
                <tbody id="eb14FileRows"></tbody>
            </table>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button type="button" id="btnEb14Confirm"
                        style="background:#17a2b8; color:#fff; padding:6px 18px; border:none;
                           border-radius:4px; cursor:pointer; font-size:13px;">수신</button>
                <button type="button" id="btnEb14Cancel"
                        style="background:#f5f6fa; color:#333; padding:6px 18px;
                           border:1px solid #dde0ea; border-radius:4px; cursor:pointer; font-size:13px;">취소</button>
            </div>
        </div>
    </div>

</th:block>
<th:block layout:fragment="scripts">
    <th:block th:replace="common/ax5_uploader :: ax5_uploader"></th:block>
    <script type="text/javascript">
        var theGrid, viewdata;
        var agreeUploader = null;
        var currentItem = null;

        var columns = [
            {binding: 'id', header: 'ID', width: 60, align: 'center', visible: false},
            {
                binding: 'selected', header: '', width: 40, align: 'center',
                isReadOnly: false, dataType: 'Boolean'
            },
            {binding: 'member_name', header: '납부자명', width: 110, align: 'left'},
            {binding: 'member_no', header: '납부자번호', width: 120, align: 'center'},
            {binding: 'bank_name', header: '은행', width: 80, align: 'center'},
            {binding: 'bank_account', header: '계좌번호', width: 150, align: 'center'},
            {
                binding: 'apply_date', header: '신청일', width: 100, align: 'center',
                cellTemplate: function (ctx) {
                    var v = String(ctx.value || '');
                    return v.length === 8
                        ? v.substring(0, 4) + '-' + v.substring(4, 6) + '-' + v.substring(6, 8) : v || '-';
                }
            },
            {
                binding: 'ei13_status', header: 'EI13', width: 90, align: 'center',
                cellTemplate: function (ctx) {
                    return flowBadge(ctx.value);
                }
            },
            {binding: 'ei13_sent_at', header: 'EI13 송신일시', width: 130, align: 'center',
                cellTemplate: function(ctx) { return formatDatetime(ctx.value); }},
            {
                binding: 'eb13_status', header: 'EB13', width: 90, align: 'center',
                cellTemplate: function (ctx) {
                    return flowBadge(ctx.value);
                }
            },
            {binding: 'eb13_sent_at', header: 'EB13 송신일시', width: 130, align: 'center',
                cellTemplate: function(ctx) { return formatDatetime(ctx.value); }},
            {
                binding: 'eb14_result', header: 'EB14', width: 80, align: 'center',
                cellTemplate: function (ctx) {
                    if (!ctx.value) return '<span class="flow-step flow-pending">대기</span>';
                    return ctx.value === 'N'
                        ? '<span class="flow-step flow-rejected">불능</span>'
                        : '<span class="flow-step flow-approved">정상</span>';
                }
            },
            {binding: 'eb14_fail_code', header: '불능코드', width: 80, align: 'center'},
            {
                binding: 'status', header: '최종상태', width: 90, align: 'center',
                cellTemplate: function (ctx) {
                    var item = ctx.row.dataItem;
                    // EB13 송신완료면 승인대기로 표시
                    if (ctx.value === 'PENDING' && item.eb13_status === 'SENT') {
                        return '<span class="status-badge status-SENT">승인대기</span>';
                    }
                    var map = {PENDING: '대기', APPROVED: '승인완료', REJECTED: '거절', FAILED: '실패', CANCELLED: '해지완료'};
                    var cls = {PENDING: 'status-PENDING', APPROVED: 'status-APPROVED', REJECTED: 'status-REJECTED', FAILED: 'status-FAILED', CANCELLED: 'status-CANCELLED'};
                    return '<span class="status-badge ' + (cls[ctx.value] || '') + '">'
                        + (map[ctx.value] || ctx.value || '') + '</span>';
                }
            },
            {binding: 'agree_file_path', header: '동의서', width: 70, align: 'center',
                cellTemplate: function(ctx) {
                    return ctx.value
                        ? '<span class="flow-step flow-approved">첨부됨</span>'
                        : '<span class="flow-step flow-pending">미첨부</span>';
                }},
            {binding: 'memo', header: '메모', width: 150, align: 'left'},
        ];

        function flowBadge(status) {
            var map = {PENDING: '대기', SENT: '송신완료', FAILED: '실패'};
            var cls = {PENDING: 'flow-pending', SENT: 'flow-sent', FAILED: 'flow-failed'};
            return '<span class="flow-step ' + (cls[status] || 'flow-pending') + '">'
                + (map[status] || status || '-') + '</span>';
        }

        var currentPage = 0, totalPages = 1;

        document.readyState === 'complete' ? init() : window.onload = init;

        function init() {
            searchList(0);
        }

        function searchList(page) {
            if (page < 0 || page >= totalPages) return;
            currentPage = page;
            $.ajax({
                url: withCtx('/api/cms/account-register/list'),
                type: 'GET',
                data: {
                    memberName: $('#srchMemberName').val(),
                    status: $('#srchStatus').val(),
                    page: currentPage,
                    size: 10
                },
                success: function(result) {
                    if (result.success) {
                        var d = result.data;
                        bindGrid(d.data);
                        updateSummary(d);
                        updatePagination(d.totalCount);
                        updateButtons();

                        // EB14 버튼 — 선택 무관, EB13 SENT 건 존재 여부
                        var hasEb13Sent = d.data.some(function(i) {
                            return i.eb13_status === 'SENT' && !i.eb14_received_at;
                        });
                        $('#btnReceiveEb14')
                            .prop('disabled', !hasEb13Sent)
                            .css({
                                'background': hasEb13Sent ? '#17a2b8' : '#a0d8e0',
                                'cursor': hasEb13Sent ? 'pointer' : 'not-allowed'
                            });
                    }
                }
            });
        }

        function updatePagination(totalCount) {
            totalPages = Math.max(1, Math.ceil(totalCount / 10));
            $('#pageInfo').text((currentPage + 1) + ' / ' + totalPages + ' 페이지');
            $('#btnFirstPage, #btnPrevPage').prop('disabled', currentPage === 0);
            $('#btnNextPage, #btnLastPage').prop('disabled', currentPage >= totalPages - 1);
        }

        function bindGrid(data) {
            data.forEach(function (item) {
                item.selected = false;
            });
            viewdata = new wijmo.collections.CollectionView(data);

            if (theGrid) {
                theGrid.itemsSource = viewdata;
                return;
            }

            theGrid = new wijmo.grid.FlexGrid('#theGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                columns: columns,
                isReadOnly: true,
                itemsSource: viewdata
            });
            theGrid.rowHeaders.columns.splice(0, 1);

            theGrid.formatItem.addHandler(function (s, e) {
                var col = s.columns[e.col];
                if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader
                    && col.binding === 'selected') {
                    e.cell.innerHTML = '<input type="checkbox" id="chkAll">';
                    var chk = e.cell.querySelector('#chkAll');
                    if (chk) {
                        chk.onclick = function (ev) {
                            viewdata.items.forEach(function (r) {
                                // 종료 상태(승인완료/해지완료)는 전체선택에서 제외
                                if (r.status === 'APPROVED' || r.status === 'CANCELLED') return;
                                r.selected = ev.target.checked;
                            });
                            theGrid.refresh();
                            updateButtons();
                        };
                    }
                }
                if (e.panel.cellType === wijmo.grid.CellType.Cell
                    && col.binding === 'selected') {
                    var item = s.rows[e.row].dataItem;
                    // 최종상태가 끝까지 간 건(승인완료/해지완료)은 선택 불가 → '-'
                    if (item && (item.status === 'APPROVED' || item.status === 'CANCELLED')) {
                        e.cell.innerHTML = '<span style="color:#bbb;">-</span>';
                    } else {
                        e.cell.innerHTML = '<input type="checkbox" class="row-check"'
                            + (item && item.selected ? ' checked' : '') + '>';
                    }
                }
            });

            theGrid.hostElement.addEventListener('dblclick', function () {
                var item = theGrid.selectedItems[0];
                if (!item) return;
                showFilePanel(item);
            });

            $('#theGrid').on('change', '.row-check', function () {
                var row = theGrid.hitTest(this).row;
                if (row >= 0 && viewdata.items[row]) {
                    viewdata.items[row].selected = $(this).is(':checked');
                }
                updateButtons();
            });
        }

        function updateSummary(d) {
            var data = d.data;
            $('#summaryTotal').text((d.totalCount || 0).toLocaleString());
            $('#summaryApproved').text(data.filter(function (i) { return i.status === 'APPROVED'; }).length);
            $('#summaryPending').text(data.filter(function (i) { return i.status === 'PENDING'; }).length);
            $('#summaryRejected').text(data.filter(function (i) { return i.status === 'REJECTED'; }).length);
            $('#summaryFailed').text(data.filter(function (i) { return i.status === 'FAILED'; }).length);
        }

        function updateButtons() {
            var selected = (viewdata ? viewdata.items : []).filter(function(i) { return i.selected; });

            var canRegister = selected.some(function(i) {
                // 신규: EI13부터 (PENDING/PENDING/PENDING)
                var isNew = i.status === 'PENDING'
                    && i.ei13_status === 'PENDING'
                    && i.eb13_status === 'PENDING';
                // 해지: EI13 불필요 (apply_type=3, ei13 SENT, eb13 PENDING)
                var isCancel = i.apply_type === '3'
                    && i.status === 'PENDING'
                    && i.ei13_status === 'SENT'
                    && i.eb13_status === 'PENDING';
                return isNew || isCancel;
            });

            var canReRegister = selected.some(function(i) {
                return i.status === 'REJECTED'
                    || i.status === 'FAILED'
                    || i.ei13_status === 'FAILED'
                    || i.eb13_status === 'FAILED'
                    || (i.ei13_status === 'PENDING' && i.eb13_status !== 'PENDING');
            });

            $('#btnRegister')
                .prop('disabled', !canRegister)
                .css({
                    'background': canRegister ? '#4a6cf7' : '#c0c8f0',
                    'color': '#fff',
                    'cursor': canRegister ? 'pointer' : 'not-allowed'
                });

            $('#btnReRegister')
                .prop('disabled', !canReRegister)
                .css({
                    'background': canReRegister ? '#6c757d' : '#c8cacc',
                    'color': '#fff',
                    'cursor': canReRegister ? 'pointer' : 'not-allowed'
                });

        }

        // 계좌등록 신청 — EI13 → EB13 자동 순서 처리
        function register() {
            var ids = getSelectedIds();
            if (!ids.length) {
                Alert.alert('', '신청할 항목을 선택하세요.');
                return;
            }

            // 파일 없는 건 체크
            var noFileItems = (viewdata ? viewdata.items : [])
                .filter(function(i) { return i.selected && i.status === 'PENDING'; })
                .filter(function(i) {
                    return !i.agree_file_path && i.ei13_status === 'PENDING'; // EI13 미시도 건만 체크
                });

            if (noFileItems.length > 0) {
                Alert.alert('', '동의서 파일을 먼저 첨부해주세요.\n(더블클릭하여 파일을 등록할 수 있습니다.)');
                return;
            }
            Alert.confirm('', ids.length + '건 계좌등록을 신청하시겠습니까?', function () {
                AjaxUtil.postAsyncData('/api/cms/account-register/register',
                    {ids: ids.join(',')}, function (result) {
                        if (result.success) {
                            var d = result.data || {};
                            Alert.alert('', '신청 완료: 성공 ' + (d.sent || 0) + '건, 실패 ' + (d.failed || 0) + '건');
                        } else {
                            Alert.alert('신청 실패', result.message);
                        }
                        searchList(0);
                    });
            });
        }

        // 재신청 — REJECTED 건 새 PENDING 생성
        function reRegister() {
            var ids = getSelectedIds().filter(function(id) {
                var item = viewdata.items.find(function(i) { return i.id === id; });
                return item && (
                    item.status === 'REJECTED' ||
                    item.status === 'FAILED' ||
                    item.ei13_status === 'FAILED' ||
                    item.eb13_status === 'FAILED' ||
                    (item.ei13_status === 'PENDING' && item.eb13_status !== 'PENDING') ||
                    (item.eb13_status === 'PENDING' && item.ei13_status === 'SENT')
                );
            });
            if (!ids.length) {
                Alert.alert('', '재신청할 항목을 선택하세요.');
                return;
            }
            Alert.confirm('', ids.length + '건을 재신청하시겠습니까?', function () {
                AjaxUtil.postAsyncData('/api/cms/account-register/re-register',
                    {ids: ids.join(',')}, function (result) {
                        if (result.success) {
                            var d = result.data || {};
                            Alert.alert('', '재신청 완료: 성공 ' + (d.sent||0) + '건, 실패 ' + (d.failed||0) + '건');
                        } else {
                            Alert.alert('재신청 실패', result.message);
                        }
                        searchList(0);
                    });
            });
        }

        function getSelectedIds() {
            return (viewdata ? viewdata.items : [])
                .filter(function (i) {
                    return i.selected;
                })
                .map(function (i) {
                    return i.id;
                });
        }

        // 파일 모달
        function showFilePanel(item) {
            currentItem = item;

            var statusLabel = { PENDING:'대기', APPROVED:'승인완료', REJECTED:'거절' }[item.status] || item.status;
            var data = {
                member_name:  item.member_name  || '',
                bank_account: item.bank_account || '',
                status_label: statusLabel
            };

            var content = tmpl('agreeFileTmpl', data);
            var $content = $(content);

            var modal = new PopupDraggable('동의서 파일 관리');
            modal.open({ width: 500, height: 420, $content });

            // 모달 열린 후 업로더 초기화
            setTimeout(function() {
                agreeUploader = null;
                $('#modalAgreeUploaderDiv').empty();
                agreeUploader = new ax5FileUploadClass('modalAgreeUploaderDiv', item.id, {
                    table_name:   'AGREE',
                    attach_name:  'AGREE',
                    accept_files: 'pdf,jpg,jpeg,png,gif,tif',
                    multiple:     false,
                    max_count:    1,
                    file_size:    0.3,
                    manual_upload: false,
                    upload_callback: function() {
                        $.ajax({
                            url: withCtx('/api/cms/account-register/update-file'),
                            type: 'POST',
                            headers: { 'X-CSRF-TOKEN': $('[name=_csrf]').val() },
                            data: { id: item.id, member_id: item.member_id },
                            success: function() { modal.close(); searchList(0); }
                        });
                    },
                    can_write: item.status === 'PENDING' || item.ei13_status === 'FAILED'
                });

                // deleteFile 오버라이드 — 파일 삭제 시 agree_file_path 초기화
                var originalDeleteFile = agreeUploader.deleteFile.bind(agreeUploader);
                agreeUploader.deleteFile = function(fileIndex) {
                    var result = originalDeleteFile(fileIndex);
                    if (result) {
                        $.ajax({
                            url: withCtx('/api/cms/account-register/clear-file'),
                            type: 'POST',
                            headers: { 'X-CSRF-TOKEN': $('[name=_csrf]').val() },
                            data: { id: item.id },
                            success: function() { searchList(0); }
                        });
                    }
                    return result;
                };
            }, 100);
        }

        // 공통 함수 추가
        function formatDatetime(val) {
            if (!val) return '-';
            var s = String(val).replace('T', ' ');
            return s.length >= 19 ? s.substring(0, 19) : s;
        }

        function receiveEb14() {
            $.ajax({
                url: withCtx('/api/cms/account-register/eb14-file-list'),
                type: 'GET',
                success: function(result) {
                    if (!result.success || !result.data || result.data.length === 0) {
                        Alert.alert('', '수신 가능한 EB14 파일이 없습니다.');
                        return;
                    }
                    var html = '';
                    result.data.forEach(function(f) {
                        var processed = f.processed;
                        var badge = processed
                            ? '<span style="background:#d4edda; color:#155724; padding:2px 8px; border-radius:8px; font-size:11px;">처리완료</span>'
                            : '<span style="background:#fff3cd; color:#856404; padding:2px 8px; border-radius:8px; font-size:11px;">미처리</span>';
                        html += '<tr>'
                            + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">'
                            +   (processed ? '' : '<input type="checkbox" class="eb14-check" data-date="' + f.transactionDate + '" checked>')
                            + '</td>'
                            + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">' + f.fileName + '</td>'
                            + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">' + f.transactionDate + '</td>'
                            + '<td style="padding:7px 8px; border:1px solid #dde0ea; text-align:center;">' + badge + '</td>'
                            + '</tr>';
                    });
                    $('#eb14FileRows').html(html);
                    $('#modalEb14').css('display', 'flex');
                }
            });
        }

        function doReceiveEb14() {
            var dates = [];
            $('.eb14-check:checked').each(function() {
                dates.push($(this).data('date'));
            });
            if (dates.length === 0) {
                Alert.alert('', '수신할 파일을 선택하세요.');
                return;
            }
            $('#modalEb14').hide();

            var done = 0;
            dates.forEach(function(date) {
                AjaxUtil.postAsyncData('/api/cms/account-register/receive-eb14',
                    { target_date: date },
                    function(result) {
                        done++;
                        if (done === dates.length) {
                            Alert.alert('', dates.length + '건 수신 완료');
                            searchList(0);
                        }
                    }
                );
            });
        }

        function createFromErp() {
            Alert.confirm('', '미인증 납부자의 계좌등록 신청을 생성하시겠습니까?', function () {
                AjaxUtil.postAsyncData('/api/cms/account-register/create-from-erp', {}, function (result) {
                    if (result.success) {
                        var d = result.data || {};
                        Alert.alert('', '생성 완료: ' + (d.created || 0) + '건');
                    } else {
                        Alert.alert('실패', result.message);
                    }
                    searchList(0);
                });
            });
        }

        $(document).ready(function () {
            $('#btnSearch').click(function () {
                searchList(0);
            });
            $('#srchMemberName').keypress(function (e) {
                if (e.which === 13) searchList(0);
            });
            $('#btnRegister').click(register);
            $('#btnReRegister').click(reRegister);
            $('#btnReceiveEb14').click(receiveEb14);
            $('#btnCreateFromErp').click(createFromErp);
            $('#btnEb14Confirm').click(doReceiveEb14);
            $('#btnEb14Cancel').click(function () {
                $('#modalEb14').hide();
            });
        });
    </script>
